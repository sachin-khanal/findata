name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # findata supports macOS and Linux; Windows is not supported (the daemon's event streams
    # and lock do not work there), so it is not in the matrix.
    # SQLCipher ships as prebuilt wheels (sqlcipher3); running on every supported OS/arch makes a
    # missing wheel or a platform-specific keychain/permission bug fail here, not on a user's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
