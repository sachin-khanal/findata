name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # findata supports macOS on Apple silicon only for now (macos-latest is an arm64 runner).
    # Linux, Intel Macs and Windows are not supported and are not tested.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
